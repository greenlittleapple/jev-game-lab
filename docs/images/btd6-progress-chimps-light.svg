<text x="24" y="258" font-size="15"><tspan font-weight="600" fill="#0b0b0b">v1</tspan><tspan fill="#898781" font-size="13"> · 1 run</tspan></text>
<text x="24" y="278" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Defence floor rules (no starting or waiting while undefended), known answers and track</text>
<text x="24" y="296" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">coverage per option, at most 16 options per question</text>
<path d="M590,272 H603.8 A3,3 0 0 1 606.8,275 V275 A3,3 0 0 1 603.8,278 H590 Z" fill="#2a78d6" fill-opacity="0.35"/>
<circle cx="606.8" cy="275" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="618.8" y="280" font-size="13" font-weight="600"><tspan fill="#0b0b0b">6</tspan></text>
<text x="24" y="328" font-size="15"><tspan font-weight="600" fill="#0b0b0b">v2</tspan><tspan fill="#898781" font-size="13"> · 1 run</tspan></text>
<text x="24" y="348" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Floor from each round's bloons: estimated pops against RBE with a margin for the lives</text>
<text x="24" y="366" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">left, camo, lead and early-track checks; Quincy ranked early</text>
<path d="M590,342 H603.8 A3,3 0 0 1 606.8,345 V345 A3,3 0 0 1 603.8,348 H590 Z" fill="#2a78d6" fill-opacity="0.35"/>
<circle cx="606.8" cy="345" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="618.8" y="350" font-size="13" font-weight="600"><tspan fill="#0b0b0b">6</tspan></text>
<text x="24" y="398" font-size="15"><tspan font-weight="600" fill="#0b0b0b">v6 r5 (btd6-open-v3) graded</tspan><tspan fill="#898781" font-size="13"> · 3 runs</tspan></text>
<text x="24" y="418" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">v4 plus fixed rules that later revisions extend (each revision is described in</text>
<text x="24" y="436" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">docs/PLAN.md and policy-v6.mjs). The first two: waiting gives way to the most probable</text>
<text x="24" y="454" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">purchase when more than half of Jev's probability is on purchases, and no new placements</text>
<text x="24" y="472" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">(other than the hero) while 12 or more towers are placed. Later ones, with one life</text>
<text x="24" y="490" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">(CHIMPS, or Hard Standard in zero-leak mode): when a coming round is short of pops,</text>
<text x="24" y="508" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">camo, Lead or MOAB damage, the options are cut to the purchases that answer it, saving</text>
<text x="24" y="526" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">for one when none is affordable. v6 revision 5 under ruleset btd6-open-v3 with graded</text>
<text x="24" y="544" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">game speed (--speed graded)</text>
