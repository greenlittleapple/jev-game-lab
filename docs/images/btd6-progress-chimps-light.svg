<title id="t">How far each version got</title><desc id="d">v0: best round 6; v1: best round 6; v2: best round 6; v6 r5 (btd6-open-v3) graded: best round 6; v6 r6 (btd6-open-v3) graded: best round 6; v6 r7 (btd6-open-v3) graded: best round 6; v6 r8 (btd6-open-v3) graded: best round 76; v6 r9 (btd6-open-v3) graded: best round 95; v6 r10 (btd6-open-v3) graded: best round 78; v6 r11 (btd6-open-v3): best round 90; v6 r11 (btd6-open-v3) graded: best round 93; v6 r14 (btd6-open-v3) graded: best round 95; v6 r17 (btd6-open-v3): best round 93; v6 r17 (btd6-open-v3) graded: best round 95; v6 r18 (btd6-open-v3): best round 95; v6 r18 (btd6-open-v3) graded: best round 95; v6 r19 (btd6-open-v3) graded: best round 93</desc>
<rect width="960" height="1326" rx="12" fill="#fcfcfb"/>
<text x="24" y="40" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">How far each version got</text>
<text x="24" y="64" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Bloons TD 6, Monkey Meadow, CHIMPS (rounds 6 to 100, 1 life); ruleset btd6-open-v1 unless the row names another. Each</text>
<text x="24" y="84" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">dot is one run, green if it won; the bar reaches the best run.</text>
<text x="657.2" y="120" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">Camo</text>
<text x="657.2" y="137" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">round 24</text>
<text x="702" y="120" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">MOAB</text>
<text x="702" y="137" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">round 40</text>
<text x="758" y="120" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">BFB</text>
<text x="758" y="137" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">round 60</text>
<text x="814" y="120" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">ZOMG</text>
<text x="814" y="137" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">round 80</text>
<text x="870" y="120" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">BAD</text>
<text x="870" y="137" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">round 100</text>
