<text x="24" y="206" font-size="15"><tspan font-weight="600" fill="#0b0b0b">v0</tspan><tspan fill="#898781" font-size="13"> · 1 run</tspan></text>
<text x="24" y="226" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Jev alone over every affordable placement, upgrade and wait (73 options at the start)</text>
<path d="M590,211 H603.8 A3,3 0 0 1 606.8,214 V214 A3,3 0 0 1 603.8,217 H590 Z" fill="#2a78d6" fill-opacity="0.35"/>
